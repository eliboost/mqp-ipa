                            like maxSizeBytes, pageLimitBytes, pageFullMessagePolicy
                            and expiryDelay. See https://activemq.apache.org/components/artemis/documentation/latest/address-model.html#address-settings
                          properties:
                            addressFullMessagePolicy:
                              description: AddressFullMessagePolicy defines the policy
                                to apply when the maxSizeBytes limit is reached. FAIL
                                will reject new messages, DROP will drop old messages.
                                See https://artemis.apache.org/components/artemis/documentation/latest/paging.html#paging-mode
                              enum:
                              - PAGE
                              - FAIL
                              - DROP
                              - BLOCK
                              type: string
                            expiryDelay:
                              description: ExpiryDelay defines the time in milliseconds
                                after which a message will expire. See https://artemis.apache.org/components/artemis/documentation/latest/message-expiry.html
                              type: integer
                            maxDeliveryAttempts:
                              description: MaxDeliveryAttempts defines the max attempts
                                to try a redelivery.
                              type: integer
                            maxRedeliveryDelay:
                              description: MaxRedeliveryDelay defines the max value
                                the delay can become.
                              type: integer
                            maxSizeBytes:
                              description: MaxSizeBytes defines the maximum size of
                                the queue in bytes. When the limit is reached, the
                                configured pageFullMessagePolicy will be applied.
                                A value of -1 means no limit, this is the default
                                value. See https://artemis.apache.org/components/artemis/documentation/latest/paging.html#paging-mode
                              type: integer
                            pageFullMessagePolicy:
                              description: PageFullMessagePolicy defines the policy
                                to apply when the pageLimitBytes is reached. FAIL
                                will reject new messages, DROP will drop old messages.
                                See https://artemis.apache.org/components/artemis/documentation/latest/paging.html#paging-mode
                              enum:
                              - FAIL
                              - DROP
                              type: string
                            pageLimitBytes:
                              description: PageLimitBytes defines the size of the
                                in-memory buffer for messages. When the limit is reached,
                                messages will be paged to disk. See https://artemis.apache.org/components/artemis/documentation/latest/paging.html#paging-mode
                              type: integer
                            redeliveryDelay:
                              description: RedeliveryDelay defines the time in milliseconds
                                the broker will wait before redelivering the messages.
                              type: integer
                            redeliveryMultiplier:
                              description: RedeliveryMultiplier defines the multiplier
                                the last delay time a message is redelivered will
                                be multiplied with.
                              pattern: ^[0-9]+(\.[0-9]+)?$
                              type: string
                            redistributionDelay:
                              description: |-
                                RedistributionDelay defines the delay in milliseconds between detecting the need for redistribution and actually attempting redistribution.
                                A delay of zero means the messages will be immediately redistributed. A value of -1 signifies that messages will never be redistributed.
                              type: integer

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pf-activemq-operator
spec:
  selector:
    matchLabels:
      app: pf-activemq-operator
  template:
    metadata:
      name: pf-activemq-operator
      labels:
        app: pf-activemq-operator
      annotations:
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
        prometheus.io/scheme: "http"
        prometheus.io/scrape: "true"
    spec:
      serviceAccountName: pf-activemq-operator
      containers:
        - name: pf-activemq-operator
          image: middleware-docker-staging-local.repo.pnet.ch/pf/middleware/pf-activemq-operator:latest
          imagePullPolicy: Always
          args:
            - --metrics-bind-address=:8080
          resources:
            limits:
              memory: 4G
          ports:
            - containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20



# DO NOT EDIT THIS FILE, IT WILL BE OVERWRITTEN IN JOB update-config-files
plugins:
  - "prettier-plugin-java"
  - "@prettier/plugin-xml"

overrides:
  - files:
      - '**/*.*'
    options:
      endOfLine: lf
      printWidth: 180
      singleQuote: true
      tabWidth: 4
      useTabs: false
  - files:
      - '**/*.xml'
    options:
      parser: xml
      xmlWhitespaceSensitivity: ignore
      endOfLine: lf
      printWidth: 180
      singleQuote: true
      tabWidth: 4
      useTabs: false
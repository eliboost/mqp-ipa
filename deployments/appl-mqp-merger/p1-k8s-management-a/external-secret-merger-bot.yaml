apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: instance-merger-bot-token
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: default
    kind: SecretStore
  target:
    name: instance-merger-bot-token
    deletionPolicy: Delete
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: secret/team_middleware/gitlab/access_tokens/service_accounts/sgcdis-instance-merger-bot/instance-merger-bot-token
        metadataPolicy: None
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: secret-env
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: default
    kind: SecretStore
  target:
    name: secret-env
    deletionPolicy: Delete
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: secret/team_middleware/k8s/p1-k8s-management/appl-mqp-merger-p1/secret-env
        metadataPolicy: None

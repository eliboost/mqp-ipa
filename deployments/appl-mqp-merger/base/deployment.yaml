apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: instances-merger
    app.kubernetes.io/name: instances-merger
  name: instances-merger
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: instances-merger
      app.kubernetes.io/name: instances-merger
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scheme: http
        prometheus.io/scrape: "true"
        collectord.io/output: 'splunk'
        collectord.io/logs-index: midwprod
      labels:
        app.kubernetes.io/instance: instances-merger
        app.kubernetes.io/name: instances-merger
    spec:
      containers:
      - name: instances-merger
        env:
        - name: MERGER_MANAGER_LEADER_ELECTION
          value: 'true'
        - name: MERGER_MANAGER_LEADER_ELECTION_ID
          value: b5f0358c.postfinance.ch
        - name: MERGER_GITLAB_REPOSITORY
          value: activemq/instances
        - name: MERGER_GITLAB_TARGET_BRANCH
          value: main
        - name: MERGER_LOG_ENCODER
          value: logfmt
        envFrom:         
        - secretRef:                                
            name: secret-env
        image: instances-merger
        imagePullPolicy: Always
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        ports:
        - containerPort: 8081
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 500m
            ephemeral-storage: 200Mi
            memory: 128Mi
          requests:
            cpu: 10m
            ephemeral-storage: 50Mi
            memory: 64Mi
        securityContext:
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 64000
          runAsGroup: 64000
      securityContext:
        runAsNonRoot: true
      serviceAccountName: instances-merger

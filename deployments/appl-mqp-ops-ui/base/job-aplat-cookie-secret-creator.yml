apiVersion: batch/v1
kind: Job
metadata:
  name: mqp-ops-ui-aplat-cookie-secret-creator-job
  labels:
    app: mqp-ops-ui-appl
  annotations:
    collectord.io/output: "splunk"
    collectord.io/logs-index: "midwitd"
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: mqp-ops-ui-aplat-cookie-secret-renewer-sa
      containers:
        - name: secretcreator
          image: middleware-docker.repo.pnet.ch/alpine/k8s
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - date; head -c 512 /dev/urandom > secret; kubectl get secret aplat-cookie-secret > /dev/null 2>&1 || kubectl create secret generic aplat-cookie-secret --from-file secret
      restartPolicy: Never

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mqp-ops-ui-httproute
spec:
  parentRefs:
    - name: default
      namespace: kube-istio
  hostnames:
    - "mqp-ops-ui-nonprod.p1-management-a.pnet.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mqp-ops-ui-nonprod/api
      backendRefs:
        - name: mqp-ops-ui-backend-svc
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /saml2/sp/acs/post
      backendRefs:
        - name: mqp-ops-ui-backend-svc
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /mqp-ops-ui-nonprod
      backendRefs:
        - name: mqp-ops-ui-frontend-svc
          port: 4200
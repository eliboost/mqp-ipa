apiVersion: v1
kind: Service
metadata:
  name: mqp-ops-ui-backend-svc
  labels:
    appl: mqp-ops-ui-appl
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    appl: mqp-ops-ui-backend
---
apiVersion: v1
kind: Service
metadata:
  name: mqp-ops-ui-frontend-svc
  labels:
    appl: mqp-ops-ui-appl
spec:
  type: ClusterIP
  ports:
    - port: 4200
      targetPort: 4200
      protocol: TCP
      name: http
  selector:
    appl: mqp-ops-ui-frontend
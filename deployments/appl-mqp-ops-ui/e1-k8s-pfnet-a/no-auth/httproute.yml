apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mqp-ops-ui-httproute
spec:
  parentRefs:
    - name: default
      namespace: kube-istio
  hostnames:
    - "mqp-ops-ui.e1-pfnet-a.pnet.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mqp-ops-ui/api
      backendRefs:
        - name: mqp-ops-ui-backend-svc
          port: 8080

    - matches:
        - path:
            type: PathPrefix
            value: /mqp-ops-ui
      backendRefs:
        - name: mqp-ops-ui-frontend-svc
          port: 4200
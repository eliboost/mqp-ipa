apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: default
    kind: SecretStore
  target:
    name: backend
    deletionPolicy: Delete
  dataFrom:
    - extract:
        conversionStrategy: Default
        decodingStrategy: None
        key: secret/team_mqp/k8s/e1-k8s-pfnet/appl-mqp-ops-ui-no-auth-e1/backend
        metadataPolicy: None

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mqp-ops-ui-httproute
spec:
  parentRefs:
    - name: default
      namespace: kube-istio
  hostnames:
    - "mqp-ops-ui-with-auth.e1-pfnet-a.pnet.ch"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/"
      backendRefs:
        - name: mqp-ops-ui-esproxy-svc
          port: 8289
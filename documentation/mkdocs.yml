theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.top
plugins:
  - blog:
      archive: false
      blog_toc: true
  - techdocs-core
  - rss:
        match_path: blog/posts/.*
        date_from_meta:
            as_creation: date
        abstract_chars_count: 10000
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
spring.application.name=artemis-monitor

spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:8816
spring.artemis.user=artemis
spring.artemis.password=artemis

# metrics
management.metrics.tags.application=${spring.application.name}
management.endpoints.web.exposure.include=prometheus,health

server.port=8080

# custom
application.sender.delay=1000
application.destination=mqp.example.TEST
application.message.sla.delay=10000
application.consumer.delay.min=0
application.consumer.delay.max=0
application.sender.enabled=true
application.consumer.enabled=true

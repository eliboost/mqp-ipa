user  nginx;
worker_processes  auto;

error_log  /dev/stdout warn;
pid        /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/javascript;

    server {
        listen 4200;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;

        # Load configuration files for the default server block.
        include /etc/nginx/default.d/*.conf;

        location /mqp-ops-ui/ {
          try_files $uri$args $uri$args/ /mqp-ops-ui/index.html;
        }

        location /mqp-ops-ui-nonprod/ {
          try_files $uri$args $uri$args/ /mqp-ops-ui-nonprod/index.html;
        }

        # --- disable cache for index.html & json ---
        location ~ ^/(mqp-ops-ui|mqp-ops-ui-nonprod)/(index\.html|.*\.json)$ {
            expires -1;
            add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        }

        # --- long cache for static assets ---
        location ~ ^/(mqp-ops-ui|mqp-ops-ui-nonprod)/.*\.(js|css)$ {
            add_header Cache-Control 'max-age=31449600';
        }
    }
}

set $forbidden_check 0;

# check if APLAT_SESSION cookie is set
# cookie name can be found in ch.postfinance.aplat.security.providers.common.SerializedToken
if ($cookie_aplat_session = "") {
  set $forbidden_check 1;
}

# check if not kubernetes probe
if ($http_user_agent !~* "^kube-probe\/") {
  set $forbidden_check "${forbidden_check}1";
}

# HTTP 403 if all forbidden checks true
if ($forbidden_check = 11) {
  return 403;
}
